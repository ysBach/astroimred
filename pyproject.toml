[project]
name = "astroimred"
version = "0.4.1"
description = "FITS file management and lightweight inspection utilities."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "ysBach", email = "ysbach20766@gmail.com" }
]
requires-python = ">=3.11"
# Core dependencies for basic manipulation of FITS
dependencies = [
    "astropy>=7.0",
    "astro-ndslice>=0.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "astroapers>=0.2.0",
    "imcombiners>=0.1.2",
    "reducers>=0.4.0",
]

[project.scripts]
imred = "astroimred.reduction.cli:main"

[project.urls]
Documentation = "https://ysbach.github.io/astroimred/"
Repository = "https://github.com/ysBach/astroimred"
Issues = "https://github.com/ysBach/astroimred/issues"
Changelog = "https://github.com/ysBach/astroimred/blob/main/CHANGELOG.md"

[project.optional-dependencies]
phot = [
    "matplotlib>=3.9.1",
    "photutils>=2.0,<4.0",
    "scipy>=1.9.2",
    "sep>=1.4",
]
reduction = [
    "astroscrappy>=1.1",
    "ccdproc>=2.0",
    "click>=8.0",
    "numba>=0.59",
    "scipy>=1.9.2",
]
full = [
    "astroscrappy>=1.1",
    "ccdproc>=2.0",
    "click>=8.0",
    "fitsio>=1.2",
    "matplotlib>=3.9.1",
    "numba>=0.59",
    "numexpr>=2.8",
    "photutils>=2.0,<4.0",
    "scipy>=1.9.2",
    "sep>=1.4",
]

[dependency-groups]
dev = [
    "isort",
    "pytest>=8.0",
    "ruff>=0.8",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
]
ignore = [
    "E501",  # Let the formatter wrap what it can; tolerate intentional long lines.
    "W605",  # Legacy astronomy strings often contain backslash-style notation.
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/astroimred/**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
line-ending = "auto"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md", "RELEASING.md", "scripts/**", ".github/tests/**", "tests/**"]
