name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_SOURCES: "true"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"
      - name: Install documentation dependencies
        run: |
          uv venv --python 3.13 .venv-docs
          uv pip install --python .venv-docs/bin/python -r docs/requirements-quarto.txt -e ".[full]"
      - name: Generate API and execute offline tutorials
        run: make docs-build
      - name: Configure Pages
        if: github.repository == 'ysBach/astroimred' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/quarto/_site

  deploy:
    name: Deploy documentation
    if: github.repository == 'ysBach/astroimred' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
